    <script>
      // Gracefully handle preview sandbox WebSocket connection interruptions
      window.addEventListener('unhandledrejection', function(event) {
        if (event && event.reason) {
          var msg = (typeof event.reason.message === 'string' ? event.reason.message : '') +
                    (typeof event.reason === 'string' ? event.reason : '') +
                    (event.reason.toString ? event.reason.toString() : '');
          if (msg.indexOf('WebSocket') !== -1) {
            event.preventDefault();
          }
        }
      });
